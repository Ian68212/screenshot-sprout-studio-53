<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Gerenciador do Site | Rodrinox Pro</title><link rel="stylesheet" href="portal.css"></head><body><main style="max-width:960px;margin:2rem auto;padding:1rem"><h1>Gerenciador do site institucional</h1><p>Ambiente de desenvolvimento. Os registros ficam no banco de testes e não alteram o site público.</p><p id="aviso" role="status"></p><section><h2>Itens de conteúdo</h2><label>Categoria <select id="tipo"><option value="servico">Serviços</option><option value="projeto">Projetos</option><option value="banner">Banners</option><option value="galeria">Galeria</option></select></label><button id="atualizar" type="button">Atualizar lista</button><ul id="itens"></ul></section><section><h2>Biblioteca de imagens</h2><form id="upload" enctype="multipart/form-data"><label>Imagem JPG, PNG ou WebP (até 5 MB) <input type="file" name="imagem" accept="image/jpeg,image/png,image/webp" required></label><label>Descrição <input name="descricao" maxlength="255"></label><button type="submit">Enviar imagem</button></form><ul id="midias"></ul></section><section><h2>Criar rascunho</h2><form id="novo"><label>Identificador (sem espaços) <input name="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*"></label><label>Título <input name="titulo" required maxlength="255"></label><label>Resumo <textarea name="resumo"></textarea></label><label>Descrição <textarea name="descricao"></textarea></label><button type="submit">Salvar rascunho</button></form></section><p><a href="painel.html">Voltar ao Portal</a></p></main><script src="app.js"></script><script src="site-admin.js"></script></body></html>
