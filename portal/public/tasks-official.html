<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestão de Tarefas — Rodrinox Pro</title><style>body{margin:0;background:#f3f6fa;color:#1a2e46;font:15px system-ui,Arial}header{background:#092e56;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}a{color:inherit}main{max-width:1100px;margin:28px auto;padding:0 18px}.grid{display:grid;grid-template-columns:1fr 1.8fr;gap:20px}.card{background:white;border:1px solid #e0e7ee;border-radius:14px;padding:22px;margin-bottom:18px}h1{font-size:26px}h2{font-size:19px}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #cad4df;border-radius:8px;box-sizing:border-box}input,select,textarea{width:100%;margin:6px 0 12px}button{cursor:pointer;background:#0b4c88;color:white;border:0}button:disabled{opacity:.5}.task{border:1px solid #e0e7ee;border-radius:10px;padding:12px;margin:9px 0}.muted{color:#63788f;font-size:13px}.error{color:#b12b2b}label{display:block;font-size:13px;font-weight:600}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><header><strong>RODRINOX PRO · Gestão de Tarefas</strong><a href="/colaborador/painel.html">Voltar ao portal</a></header><main><h1>Projetos e designações</h1><p class="muted">Ambiente oficial · dados compartilhados no servidor</p><p id="message" role="status"></p><div class="grid"><div><section class="card"><h2>Projetos</h2><div id="projects"></div><form id="project-form" hidden><label>Novo projeto<input name="name" required maxlength="160"></label><button>Criar projeto</button></form></section><section class="card" id="new-task" hidden><h2>Delegar tarefa</h2><form id="task-form"><label>Projeto<select name="project_id" required></select></label><label>Título<input name="title" maxlength="220" required></label><label>Descrição<textarea name="description"></textarea></label><label>Responsável<select name="owner_id" required></select></label><label>Prioridade<select name="priority"><option value="normal">Normal</option><option value="baixa">Baixa</option><option value="alta">Alta</option><option value="urgente">Urgente</option></select></label><label>Prazo<input type="date" name="due_date"></label><button>Salvar designação</button></form></section></div><section class="card"><h2>Tarefas <small id="count"></small></h2><div id="tasks">Carregando...</div></section></div></main><script src="/colaborador/tasks-official.js?v=shared-comments-20261111" defer></script></body></html>
