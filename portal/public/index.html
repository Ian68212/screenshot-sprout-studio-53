<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#03162d">
<link rel="manifest" href="/colaborador/manifest.webmanifest">
<link rel="icon" type="image/jpeg" href="/colaborador/assets/app-icon-original.jpeg">
<link rel="apple-touch-icon" href="/colaborador/assets/app-icon-original.jpeg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rodrinox Pro">
<meta name="application-name" content="Rodrinox Pro">
<title>Acesso restrito — Rodrinox Pro</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#03162d}
body{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0;overflow-x:hidden}
.login-shell{position:relative;width:min(100vw,480px);aspect-ratio:824/1600;flex:none;isolation:isolate}
.login-art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;user-select:none;-webkit-user-drag:none}
.login-form{position:absolute;inset:0;margin:0}
.field{position:absolute;left:25.2%;width:65.8%;height:6.15%;margin:0}
.field input{position:absolute;inset:0;width:100%;height:100%;padding:0 4px;border:1px solid transparent;border-radius:8px;background:transparent;color:#fff;font:500 clamp(14px,4.8vw,21px)/1.2 Inter,"Segoe UI",Arial,sans-serif;outline:none;caret-color:#fff}
.field input:focus{border-color:rgba(112,198,255,.9);background:rgba(0,20,42,.12);box-shadow:0 0 0 2px rgba(67,177,255,.14)}
.field input:-webkit-autofill,.field input:-webkit-autofill:focus{-webkit-text-fill-color:#fff;transition:background-color 9999s ease-in-out 0s}
#email-field{top:36.45%}
#password-field{top:44.1%;width:55.5%}
#toggle-password{position:absolute;top:44.1%;left:80.1%;width:10.8%;height:6.1%;padding:0;border:0;background:transparent;color:#fff;cursor:pointer}
#toggle-password svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2;filter:drop-shadow(0 1px 2px #001)}
#submit{position:absolute;left:8.8%;top:52.35%;width:83.6%;height:6.35%;border:0;border-radius:30px;background:transparent;cursor:pointer;color:transparent}
#submit:disabled{cursor:wait;background:rgba(255,255,255,.12)}
#submit span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
#forgot-password{position:absolute;left:20%;top:60.15%;width:60%;height:4.5%;border:0;background:transparent;color:transparent;cursor:pointer}
.erro{position:absolute;top:50.1%;left:13%;width:74%;margin:0;color:#ffd0c8;text-align:center;font-size:clamp(10px,2.8vw,13px);line-height:1.15;text-shadow:0 1px 4px #001;pointer-events:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* A arte de login permanece intacta; o convite de instalação fica abaixo dela e só aparece em celulares. */
.mobile-install{display:none;width:min(calc(100% - 28px),452px);margin:14px 14px 28px;padding:14px;border:1px solid rgba(91,174,238,.38);border-radius:18px;background:linear-gradient(145deg,rgba(12,43,75,.98),rgba(3,20,39,.98));box-shadow:0 12px 34px rgba(0,0,0,.28);color:#fff;align-items:center;gap:12px}
.mobile-install img{width:54px;height:54px;flex:none;border-radius:13px;object-fit:cover}
.mobile-install-copy{min-width:0;flex:1}
.mobile-install-copy strong{display:block;font-size:15px;line-height:1.25}
.mobile-install-copy span{display:block;margin-top:4px;color:#c7d9eb;font-size:12px;line-height:1.35}
.mobile-install a{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 14px;border:0;border-radius:12px;background:#ff7900;color:#fff;text-decoration:none;font-size:13px;font-weight:700;white-space:nowrap}
.mobile-install.ios{align-items:flex-start}
.mobile-install.ios .mobile-install-copy span{font-size:13px;line-height:1.45}
@media(max-width:767px){
 body[data-install-platform="android"] #android-install,
 body[data-install-platform="ios"] #ios-install{display:flex}
}
@media(min-width:600px){body{padding:18px 0}.login-shell{width:min(calc(100dvh * .515),480px);max-height:calc(100dvh - 36px)}}
@media(max-height:680px) and (max-width:599px){body{align-items:flex-start}.login-shell{width:min(100vw,350px)}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main class="login-shell" aria-label="Acesso ao aplicativo Rodrinox Pro">
  <img class="login-art" src="/colaborador/assets/login-original.jpeg" alt="Tela de acesso original da Rodrinox Pro" fetchpriority="high">
  <form class="login-form" id="f" novalidate>
    <div class="field" id="email-field"><label class="sr-only" for="email">Usuário ou e-mail</label><input id="email" name="email" type="text" autocomplete="username" aria-label="Usuário ou e-mail" required></div>
    <div class="field" id="password-field"><label class="sr-only" for="senha">Senha</label><input id="senha" name="senha" type="password" autocomplete="current-password" aria-label="Senha" required></div>
    <button id="toggle-password" type="button" aria-label="Mostrar senha" aria-pressed="false"></button>
    <p class="erro" id="erro" role="alert" aria-live="polite"></p>
    <button id="submit" type="submit"><span>Entrar</span></button>
    <button id="forgot-password" type="button" aria-label="Esqueci minha senha"></button>
  </form>
</main>

<section class="mobile-install" id="android-install" aria-label="Baixar aplicativo Android">
  <img src="/colaborador/assets/app-icon-original.jpeg" alt="Ícone Rodrinox Pro">
  <div class="mobile-install-copy">
    <strong>Tenha o Rodrinox Pro no celular</strong>
    <span>Instale o aplicativo oficial para abrir direto pela tela inicial.</span>
  </div>
  <a href="https://github.com/Ian68212/screenshot-sprout-studio-53/releases/latest/download/Rodrinox-Pro-Android.apk" download>Baixar app</a>
</section>

<section class="mobile-install ios" id="ios-install" aria-label="Adicionar Rodrinox Pro à tela inicial">
  <img src="/colaborador/assets/app-icon-original.jpeg" alt="Ícone Rodrinox Pro">
  <div class="mobile-install-copy">
    <strong>Adicione à tela inicial</strong>
    <span>No Safari, toque em Compartilhar e escolha “Adicionar à Tela de Início” para acessar o Rodrinox Pro como aplicativo.</span>
  </div>
</section>

<script src="/colaborador/app.js"></script>
<script src="/colaborador/login.js"></script>
<script src="/colaborador/pwa.js"></script>
<script src="/colaborador/mobile-install.js"></script>
</body>
</html>
