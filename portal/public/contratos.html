<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contratos | Rodrinoxpro</title><style>body{background:#0b2035;color:#eef5ff;font:15px system-ui;margin:0}main{max-width:1200px;margin:auto;padding:24px}section,form{background:#142e46;border-radius:12px;padding:20px;margin:16px 0}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #52687c;border-radius:7px;margin:5px;max-width:95%}button{background:#f58b28;color:#172333;cursor:pointer;font-weight:bold}a{color:#a8d5ff}article{border-bottom:1px solid #52687c;padding:12px}label{display:block}textarea{width:90%}h1{margin:8px 0}</style><main><a href="/colaborador/painel/oficial">← Voltar ao portal</a><h1>Gestão de Contratos</h1><p>Rodrinoxpro · Documentos privados e histórico de versões</p><nav><button id="showContracts">Contratos</button><button id="showModels">Modelos de contratos</button></nav><p id="status" role="status"></p><div id="contracts"><section><input id="search" placeholder="Nome, empresa, CPF, CNPJ ou número"><button id="find">Pesquisar</button><div id="results"></div></section><form id="category"><h2>Nova categoria</h2><input name="nome" required maxlength="150" placeholder="Nome da categoria"><button>Salvar categoria</button></form><form id="newContract"><h2>Novo contrato</h2><label>Título <input name="titulo" required maxlength="200"></label><label>Categoria <select name="categoria_id" id="categories" required></select></label><label>Número <input name="numero"></label><label>Empresa ou colaborador <input name="contraparte"></label><label>CPF/CNPJ <input name="documento"></label><label>Objeto <textarea name="objeto"></textarea></label><button>Salvar contrato</button></form><section id="detail" hidden><h2 id="detailTitle"></h2><div id="versions"></div><form id="upload"><h3>Anexar nova versão</h3><input name="arquivo" type="file" accept="application/pdf" required><label>Motivo da atualização <textarea name="motivo"></textarea></label><button>Salvar versão</button></form></section></div><div id="models" hidden><section id="modelList"></section><form id="newModel"><h2>Novo modelo</h2><input name="titulo" required placeholder="Título"><textarea name="corpo" required rows="12" placeholder="Use {{empresa}} e {{cnpj}} para campos variáveis."></textarea><button>Salvar modelo</button></form><section id="generator" hidden><h2>Preencher modelo</h2><div id="fields"></div><textarea id="preview" rows="12" readonly></textarea><button id="download">Exportar texto</button></section></div></main><script src="/colaborador/contratos.js" defer></script></html>
