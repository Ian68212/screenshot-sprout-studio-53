<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contratos | Rodrinoxpro</title><style>body{background:#0b2035;color:#eef5ff;font:15px system-ui;margin:0}main{max-width:1200px;margin:auto;padding:24px}section,form{background:#142e46;border-radius:12px;padding:20px;margin:16px 0}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #52687c;border-radius:7px;margin:5px;max-width:95%}button{background:#f58b28;color:#172333;cursor:pointer;font-weight:bold}a{color:#a8d5ff}article{border-bottom:1px solid #52687c;padding:12px}label{display:block}textarea{width:90%}h1{margin:8px 0}main{max-width:none;padding:18px}section,form{margin:0;padding:16px;border:1px solid #24445e;background:linear-gradient(145deg,#122c43,#0d2235)}button{background:#18364e;color:#fff;border-color:#31516a}button:hover{background:#ed7815;color:white}input,select,textarea{background:#0b2035;color:#fff;border-color:#39566d}nav{display:flex;gap:8px;margin:12px 0}nav button:first-child,.primary{background:#f57810;color:white}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{padding:16px;border:1px solid #31516a;border-radius:10px;background:#142e46}.metric strong{display:block;font-size:28px}.metric:nth-child(2){border-color:#187b58}.metric:nth-child(3){border-color:#a66b20}.metric:nth-child(4){border-color:#a83b45}.workspace{display:grid;grid-template-columns:220px minmax(0,1fr) 240px;gap:12px;align-items:start}.workspace section{min-height:160px}.workspace article{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.workspace article p{flex:1}.workspace aside button{display:block;width:100%;text-align:left;margin:6px 0}.workspace h2{font-size:17px;margin-top:0}dialog{background:#142e46;color:white;border:1px solid #45657e;border-radius:12px;width:min(650px,90vw)}dialog::backdrop{background:#0009}form label{display:grid;grid-template-columns:150px 1fr;align-items:center}form input,form select{width:auto}#status{color:#ffc27d}@media(max-width:1000px){.workspace{grid-template-columns:180px 1fr}.workspace aside:last-child{grid-column:1/-1}}@media(max-width:650px){.workspace,.metrics{grid-template-columns:1fr 1fr}.workspace>*{grid-column:1/-1}}</style><main><a href="/colaborador/painel/oficial">← Voltar ao portal</a><h1>Gestão de Contratos</h1><p>Rodrinoxpro · Documentos privados e histórico de versões</p><div class="metrics"><div class="metric"><strong id="totalMetric">—</strong>Contratos cadastrados</div><div class="metric"><strong id="activeMetric">—</strong>Vigentes</div><div class="metric"><strong id="soonMetric">—</strong>Próximos do vencimento</div><div class="metric"><strong id="expiredMetric">—</strong>Vencidos</div></div><nav><button id="showContracts">Contratos</button><button id="showModels">Modelos de contratos</button></nav><p id="status" role="status"></p><div id="contracts"><div class="workspace"><aside><section><h2>Categorias</h2><div id="categoryList"></div><button id="addCategory">＋ Nova categoria</button></section></aside><section><h2>Contratos</h2><input id="search" placeholder="Nome, empresa, CPF, CNPJ ou número"><button id="find">Pesquisar</button><div id="results"></div></section><aside><section><h2>Ações rápidas</h2><button class="primary" id="addContract">＋ Novo contrato</button><button id="quickModel">＋ Novo modelo de contrato</button></section></aside></div><dialog id="categoryDialog"><button class="closeDialog">Fechar</button><form id="category"><h2>Nova categoria</h2><input name="nome" required maxlength="150" placeholder="Nome da categoria"><button>Salvar categoria</button></form></dialog><dialog id="contractDialog"><button class="closeDialog">Fechar</button><form id="newContract"><h2>Novo contrato</h2><label>Título <input name="titulo" required maxlength="200"></label><label>Categoria <select name="categoria_id" id="categories" required></select></label><label>Número <input name="numero"></label><label>Empresa ou colaborador <input name="contraparte"></label><label>CPF/CNPJ <input name="documento"></label><label>Objeto <textarea name="objeto"></textarea></label><button>Salvar contrato</button></form></dialog><section id="detail" hidden><h2 id="detailTitle"></h2><div id="versions"></div><form id="upload"><h3>Anexar nova versão</h3><input name="arquivo" type="file" accept="application/pdf" required><label>Início da vigência <input type="date" name="inicio" required></label><label>Fim da vigência <input type="date" name="vencimento"></label><label>Prazo indeterminado <input type="checkbox" name="indeterminado" value="true"></label><label>Motivo da atualização <textarea name="motivo"></textarea></label><button>Salvar versão</button></form></section></div><div id="models" hidden><section id="modelList"></section><form id="newModel"><h2>Novo modelo</h2><input name="titulo" required placeholder="Título"><textarea name="corpo" required rows="12" placeholder="Use {{empresa}} e {{cnpj}} para campos variáveis."></textarea><button>Salvar modelo</button></form><section id="generator" hidden><h2>Preencher modelo</h2><div id="fields"></div><textarea id="preview" rows="12" readonly></textarea><button id="download">Exportar texto</button></section></div></main><script src="/colaborador/contratos.js" defer></script></html>
