name: Build Rodrinox Pro Android APK

on:
  push:
    branches: [main, mobile-app-download-option]
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-apk.yml"
      - "portal/public/assets/app-icon-original.jpeg"
  pull_request:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-apk.yml"
      - "portal/public/assets/app-icon-original.jpeg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Prepare exact original app icon
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Path("android-app/app/src/main/assets/app-icon.webp")
          if not source.exists():
              raise SystemExit("Android app icon asset not found")
          image = Image.open(source).convert("RGBA")
          if image.width != image.height:
              raise SystemExit(f"App icon must be square; got {image.size}")
          targets = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, size in targets.items():
              out = Path("android-app/app/src/main/res") / folder
              out.mkdir(parents=True, exist_ok=True)
              image.resize((size, size), Image.Resampling.LANCZOS).save(out / "ic_launcher.png")
              image.resize((size, size), Image.Resampling.LANCZOS).save(out / "ic_launcher_round.png")
          PY

      - name: Install exact user-provided logo asset
        run: |
          set -euo pipefail
          SOURCE="android-app/app/src/main/assets/Logo Vertical Rodrinoxpro Soluções Inovação Resultados Colorida 2  PNG.png"
          TARGET="android-app/app/src/main/assets/rod-logo-vertical.png"
          test -s "$SOURCE"
          cp "$SOURCE" "$TARGET"
          echo "Original PNG SHA256:"
          sha256sum "$SOURCE" "$TARGET"
          cmp "$SOURCE" "$TARGET"

      - name: Build debug APK for direct installation
        working-directory: android-app
        run: gradle --no-daemon assembleDebug

      - name: Verify packaged logo and APK signature
        run: |
          set -euo pipefail
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          SOURCE="android-app/app/src/main/assets/Logo Vertical Rodrinoxpro Soluções Inovação Resultados Colorida 2  PNG.png"
          unzip -p "$APK" assets/rod-logo-vertical.png > /tmp/rod-logo-from-apk.png
          cmp "$SOURCE" /tmp/rod-logo-from-apk.png
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          echo "Logo PNG original confirmado dentro do APK."

      - name: Rename APK
        run: |
          mkdir -p output
          cp android-app/app/build/outputs/apk/debug/app-debug.apk output/Rodrinox-Pro-Android.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Rodrinox-Pro-APK-Android
          path: output/Rodrinox-Pro-Android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public APK download
        if: github.ref == 'refs/heads/mobile-app-download-option' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: Rodrinox Pro Android — versão ${{ github.run_number }}
          files: output/Rodrinox-Pro-Android.apk
          make_latest: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
