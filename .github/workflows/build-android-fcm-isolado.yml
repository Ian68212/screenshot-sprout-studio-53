name: Build Rodrinox Pro Android — FCM isolado

on:
  push:
    branches:
      - fcm-v1.0.28-isolada
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-fcm-isolado.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fcm-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify isolated FCM source
        run: python3 android-app/tests/check_fcm_isolation.py

      - name: Restore exact binary assets from official APK 1.0.28
        run: |
          set -euo pipefail
          mkdir -p /tmp/official-1.0.28
          curl --fail --location --retry 3 \
            "https://github.com/Ian68212/screenshot-sprout-studio-53/releases/download/android-v1.0.28/Rodrinox-Pro-Android.apk" \
            -o /tmp/official-1.0.28/official.apk
          echo "8a750f9af03f46210e6a1bfdba93e79f004b94e56fd153de83f804cc94f17cdd  /tmp/official-1.0.28/official.apk" | sha256sum --check
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android-app/app/src/main/res/mipmap-${density}-v4"
            unzip -p /tmp/official-1.0.28/official.apk "res/mipmap-${density}-v4/ic_launcher.png" > "android-app/app/src/main/res/mipmap-${density}-v4/ic_launcher.png"
            unzip -p /tmp/official-1.0.28/official.apk "res/mipmap-${density}-v4/ic_launcher_round.png" > "android-app/app/src/main/res/mipmap-${density}-v4/ic_launcher_round.png"
          done
          mkdir -p android-app/app/src/main/assets/official-v1.0.28
          unzip -p /tmp/official-1.0.28/official.apk assets/rod-logo-vertical.png > android-app/app/src/main/assets/official-v1.0.28/rod-logo-vertical.png
          unzip -p /tmp/official-1.0.28/official.apk assets/rod-logo-vertical.svg > android-app/app/src/main/assets/official-v1.0.28/rod-logo-vertical.svg
          unzip -p /tmp/official-1.0.28/official.apk assets/app-icon.webp > android-app/app/src/main/assets/official-v1.0.28/app-icon.webp
          # Verify every launcher PNG is byte-for-byte identical to the official APK.
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            unzip -p /tmp/official-1.0.28/official.apk "res/mipmap-${density}-v4/ic_launcher.png" | sha256sum > "/tmp/official-1.0.28/${density}.sha"
            sha256sum "android-app/app/src/main/res/mipmap-${density}-v4/ic_launcher.png" | diff - "/tmp/official-1.0.28/${density}.sha"
          done

      - name: Build isolated test APK
        working-directory: android-app
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK metadata and checksum
        run: |
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='br.com.rodrinoxpro.portal.teste'" /tmp/apk-badging.txt
          grep -q "versionName='1.0.29-fcm-teste'" /tmp/apk-badging.txt
          mkdir -p output
          cp "$APK" output/Rodrinox-Pro-Android-v1.0.29-FCM-TESTE.apk
          sha256sum output/Rodrinox-Pro-Android-v1.0.29-FCM-TESTE.apk

      - name: Upload test APK only (no public release)
        uses: actions/upload-artifact@v4
        with:
          name: Rodrinox-Pro-Android-v1.0.29-FCM-TESTE
          path: output/Rodrinox-Pro-Android-v1.0.29-FCM-TESTE.apk
          if-no-files-found: error
          retention-days: 30
