plugins {
    id "com.android.application"
}

android {
    namespace "br.com.rodrinoxpro.portal"
    compileSdk 36

    defaultConfig {
        applicationId "br.com.rodrinoxpro.portal"
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName "1.0.1"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".teste"
            versionNameSuffix "-teste"
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
